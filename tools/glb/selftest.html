<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAGame self-test</title>
<!-- manifest memakai url relatif terhadap akar aset, sama seperti index.html di app -->
<base href="/app/src/main/assets/">
<script type="importmap">
{
  "imports": {
    "three": "/app/src/main/assets/vendor/three/build/three.module.js",
    "three/addons/": "/app/src/main/assets/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
// Uji integrasi memakai modul game yang sebenarnya (AssetLoader/SceneBuilder/MaterialSetup).
// Tidak butuh GPU untuk lolos: yang diuji scene graph, animasi, roda, dan emissive malam.
import * as THREE from 'three';
import { AssetLoader } from '/app/src/main/assets/AssetLoader.js';
import { SceneBuilder } from '/app/src/main/assets/SceneBuilder.js';
import { setDay, register } from '/app/src/main/assets/MaterialSetup.js';

const BASE = '/app/src/main/assets/';

window.runSelfTest = async () => {
  const out = { checks: [], errors: [] };
  const ok = (name, cond, detail) => out.checks.push({ name, ok: !!cond, detail });

  const al = new AssetLoader();
  const man = await al.load(BASE + 'assets/manifest.json');
  const ids = [];
  for (const cat of Object.keys(man)) for (const it of man[cat]) ids.push(it.id);

  ok('manifest termuat', ids.length === 31, `${ids.length} aset`);
  ok('tidak ada aset hilang', al.missing.length === 0, al.missing.join(', ') || 'lengkap');

  const scene = new THREE.Scene();
  const sb = new SceneBuilder(scene, al);

  // 1. semua aset bisa di-clone + punya bounding box wajar
  let zero = [], bad = [];
  for (const id of ids) {
    const g = sb.loadAsset(id, [0, 0, 0]);
    const s = g.userData.size;
    if (g.userData.missing) bad.push(id);
    else if (!(s.x > 0.05 && s.y > 0.05 && s.z > 0.05)) zero.push(`${id}(${s.x},${s.y},${s.z})`);
  }
  ok('semua aset ter-clone', bad.length === 0, bad.join(', ') || 'ok');
  ok('bounding box > 0', zero.length === 0, zero.join(', ') || 'ok');

  // 2. karakter: klip idle/walk/run/punch ada dan benar-benar menggerakkan tulang
  const pg = sb.loadAsset('player', [0, 0, 0]);
  const clips = (pg.userData.acts || []).map((a) => a.k);
  ok('player punya 4 klip', ['idle', 'walk', 'run', 'punch'].every((k) => clips.some((c) => c.includes(k))), clips.join(','));

  let legL = null;
  pg.traverse((n) => { if (n.name === 'leg_l') legL = n; });
  ok('tulang leg_l ada', !!legL);
  const before = legL ? legL.quaternion.clone() : null;
  sb.play(pg, 'walk');
  sb.update(0.22);
  const moved = legL && legL.quaternion.angleTo(before) > 0.05;
  ok('animasi walk menggerakkan kaki', moved, legL ? legL.quaternion.angleTo(before).toFixed(3) + ' rad' : '-');

  // 3. kendaraan: 4 node roda, sumbu X, dan bisa diputar tanpa menggeser posisi
  const carG = sb.loadAsset('mobil_player', [0, 0, 0]);
  const wh = carG.userData.wh || [];
  ok('mobil_player punya 4 roda', wh.length === 4, `${wh.length} node`);
  if (wh.length) {
    const w = wh[0];
    const p0 = w.position.clone();
    w.rotation.x += 1.0;
    ok('roda berputar pada porosnya', w.position.distanceTo(p0) < 1e-9, `rot.x=${w.rotation.x.toFixed(2)}`);
  }
  const busG = sb.loadAsset('bus_transjakarta', [0, 0, 0]);
  ok('bus punya 4 roda', (busG.userData.wh || []).length === 4, `${(busG.userData.wh || []).length} node`);
  const moG = sb.loadAsset('motor_1', [0, 0, 0]);
  ok('motor punya 2 roda', (moG.userData.wh || []).length === 2, `${(moG.userData.wh || []).length} node`);
  const trG = sb.loadAsset('truk_1', [0, 0, 0]);
  ok('truk punya 4 roda', (trG.userData.wh || []).length === 4, `${(trG.userData.wh || []).length} node`);
  ok('motor lebih kecil dari mobil', moG.userData.size.z < carG.userData.size.z, `${moG.userData.size.z.toFixed(2)} m`);
  const anakG = sb.loadAsset('ped_a1', [0, 0, 0]);
  ok('anak (ped_a1) lebih pendek dari pemain', anakG.userData.size.y < pg.userData.size.y * 0.9,
    `${anakG.userData.size.y.toFixed(2)} m vs ${pg.userData.size.y.toFixed(2)} m`);

  // tower apartemen: lebih tinggi dari blok umum, jendela menyala
  const aptG = sb.loadAsset('apartemen_1', [0, 0, 0]);
  const umumG = sb.loadAsset('gedung_umum_1', [0, 0, 0]);
  ok('tower apartemen lebih tinggi dari blok umum', aptG.userData.size.y > umumG.userData.size.y * 2,
    `${aptG.userData.size.y.toFixed(1)} m vs ${umumG.userData.size.y.toFixed(1)} m`);

  // 4. bianglala: node pemutar ditemukan main.js lewat regex nama
  const fg = sb.loadAsset('dufan_bianglala', [0, 0, 0]);
  let ferris = null;
  fg.traverse((n) => { if (!ferris && /wheel|roda|bianglala|rotor/i.test(n.name)) ferris = n; });
  ok('node pemutar bianglala ada', !!ferris, ferris ? ferris.name : '-');

  // 5. jendela menyala saat malam (emissiveMap terdeteksi register/setDay)
  let emissiveMats = 0;
  const bld = sb.loadAsset('gedung_pencakar_1', [0, 0, 0]);
  bld.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) if (m.emissiveMap) emissiveMats++;
  });
  ok('gedung punya material emissiveMap', emissiveMats > 0, `${emissiveMats} material`);
  setDay(1);
  let nightOn = 0;
  bld.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) if (m.emissiveMap && m.emissiveIntensity > 1) nightOn++;
  });
  ok('jendela menyala saat malam', nightOn > 0, `intensity=${nightOn ? [...bld.children].length && 1.5 : 0}`);
  setDay(0);
  let dayOff = 0, dayOn = 0;
  bld.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) if (m.emissiveMap) (m.emissiveIntensity === 0 ? dayOff++ : dayOn++);
  });
  ok('jendela padam saat siang', dayOn === 0, `${dayOff} mati / ${dayOn} nyala`);

  // 5b. tower apartemen ikut menyala malam
  setDay(1);
  let aptNight = 0;
  aptG.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) if (m.emissiveMap && m.emissiveIntensity > 1) aptNight++;
  });
  ok('jendela tower apartemen menyala', aptNight > 0, `${aptNight} material`);
  setDay(0);

  // 5c. data kota -> jumlah objek dunia
  const K = await import('/app/src/main/assets/KotaData.js');
  const npc = K.komposisiNPC(K.JUMLAH_NPC);
  ok('NPC = penduduk peta / skala', K.JUMLAH_NPC === 39, `${K.JUMLAH_NPC} orang`);
  ok('komposisi umur terisi', npc.length === K.JUMLAH_NPC && npc.includes('ped_a1'),
    `${npc.filter((x) => x === 'ped_a1').length} anak dari ${npc.length}`);
  ok('kendaraan di peta = kendaraan peta / skala', K.MAX_LALULINTAS === 45, `${K.MAX_LALULINTAS} unit`);
  ok('tower apartemen dari data', K.jumlahMenara() === 24 && K.menaraTotal() === 383,
    `${K.jumlahMenara()} dari ${K.menaraTotal()} menara`);

  // 5d. instancing gedung: 24 tower -> sedikit draw call
  const towers = Array.from({ length: 24 }, (_, i) => ({ x: i * 40, z: 0, rot: i }));
  const inst = sb.loadInstanced('apartemen_1', towers);
  const instCount = inst ? inst.children.reduce((a, m) => a + (m.isInstancedMesh ? m.count : 0), 0) : 0;
  ok('instancing gedung 24 tower', !!inst && instCount === 24 * inst.children.length && inst.children.length < 10,
    `${inst ? inst.children.length : 0} mesh untuk 24 tower`);

  // 6. instancing pohon & tiang (jalur loadInstanced)
  const tree = sb.loadInstanced('pohon_1', [{ x: 0, z: 0 }, { x: 5, z: 5, s: 1.2 }]);
  ok('instancing pohon', !!tree && tree.children.length > 0, `${tree ? tree.children.length : 0} InstancedMesh`);

  // 7. bebaskan memori
  scene.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach((m) => m.dispose()); } });

  return out;
};
window.__ready = true;
</script>
</body>
</html>
